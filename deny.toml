# cargo-deny configuration for recurlsively.
# Checks advisories (RustSec) and licenses on every CI run.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    # selectors (via scraper): weak copyleft, file-level, safe for our use
    "MPL-2.0",
]
confidence-threshold = 0.93
